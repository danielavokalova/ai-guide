<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI studijní portál</title>
  <meta name="description" content="Prompty, idea files a návody — přehledný studijní portál." />
  <meta name="color-scheme" content="dark light" />
  <style>
    :root {
      --bg: #0f1419;
      --bg-elev: #1a2332;
      --border: #2d3a4d;
      --text: #e7ecf3;
      --muted: #8b9cb3;
      --accent: #5b9fd4;
      --accent-dim: #3d6f94;
      --radius: 12px;
      --font: "Segoe UI", system-ui, -apple-system, sans-serif;
      font-size: 18px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      line-height: 1.55;
    }
    header {
      padding: 1.35rem clamp(1rem, 4vw, 2.5rem);
      border-bottom: 1px solid var(--border);
      background: var(--bg-elev);
    }
    header h1 {
      margin: 0 0 0.4rem;
      font-size: clamp(1.65rem, 3.2vw, 2.15rem);
      font-weight: 650;
      letter-spacing: -0.03em;
    }
    header p {
      margin: 0;
      font-size: 1.08rem;
      color: var(--muted);
      max-width: 52ch;
    }
    .search {
      margin-top: 1rem;
      width: 100%;
      max-width: 28rem;
      padding: 0.65rem 0.9rem;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-size: 1.05rem;
    }
    .search:focus {
      outline: 2px solid var(--accent);
      border-color: var(--accent-dim);
    }
    .page {
      max-width: 1280px;
      margin: 0 auto;
      padding: 1.75rem clamp(1rem, 4vw, 2.5rem) 2.5rem;
    }
    .section { margin-bottom: 2.35rem; }
    .section-head {
      font-size: 1.35rem;
      font-weight: 650;
      margin: 0 0 1rem;
      letter-spacing: -0.02em;
    }
    .tile-grid {
      display: grid;
      gap: 0.9rem;
      grid-template-columns: repeat(auto-fill, minmax(272px, 1fr));
    }
    a.tile {
      display: block;
      width: 100%;
      text-align: left;
      padding: 1.15rem 1.2rem;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--bg-elev);
      color: var(--text);
      font-size: 1.08rem;
      line-height: 1.38;
      font-family: inherit;
      text-decoration: none;
      cursor: pointer;
      transition: border-color 0.15s ease, background 0.15s ease, box-shadow 0.15s ease;
    }
    a.tile:hover {
      border-color: var(--accent-dim);
      background: #1f2a3d;
    }
    a.tile:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    .tail-block {
      margin-top: 2.75rem;
      padding-top: 2.25rem;
      border-top: 1px solid var(--border);
    }
  </style>
</head>
<body>
  <header>
    <h1>AI studijní portál</h1>
    <p>Prompty, idea files a návody. Kliknutím otevřeš samostatnou stránku s návodem.</p>
    <input type="search" class="search" id="q" placeholder="Hledat v názvech…" autocomplete="off" />
  </header>
  <div class="page">
    <div id="sections"></div>
  </div>
  <script>
    (async function () {
      const sectionsEl = document.getElementById("sections");
      const qEl = document.getElementById("q");

      const TAIL_IDS = new Set([
        "idea-files/osobni-ai-briefing",
        "prompty/ai-pruvodce-nastroji-osobni-konzultant",
        "prompty/claude-code-asistent-osobni-pruvodce",
      ]);
      const TAIL_ORDER = [
        "idea-files/osobni-ai-briefing",
        "prompty/ai-pruvodce-nastroji-osobni-konzultant",
        "prompty/claude-code-asistent-osobni-pruvodce",
      ];
      const SECTION_ORDER = [
        "Přehled portálu",
        "Dokumenty & návody",
        "Idea files",
        "Prompty & šablony",
      ];

      const res = await fetch("manifest.json");
      if (!res.ok) {
        sectionsEl.innerHTML = "<p>Nepodařilo se načíst manifest.json.</p>";
        return;
      }
      const data = await res.json();
      const articles = data.articles || [];

      function stripLeadingEmojiTitle(s) {
        let t = s;
        for (let i = 0; i < 6; i++) {
          const n = t.replace(/^[\uFE0F\u200D\s]*(?:\p{Extended_Pictographic})+/u, "").trimStart();
          if (n === t) break;
          t = n;
        }
        return (t || s).trim();
      }

      function displayTitle(a) {
        return stripLeadingEmojiTitle(a.title);
      }

      function partition(arts) {
        const main = [];
        const tail = [];
        for (const a of arts) {
          if (TAIL_IDS.has(a.id)) tail.push(a);
          else main.push(a);
        }
        tail.sort((a, b) => TAIL_ORDER.indexOf(a.id) - TAIL_ORDER.indexOf(b.id));
        return { main, tail };
      }

      function groupByLabel(arts) {
        const m = {};
        for (const a of arts) {
          const key = a.categoryLabel || a.category;
          if (!m[key]) m[key] = [];
          m[key].push(a);
        }
        return m;
      }

      function sortSectionLabel(a, b) {
        const ia = SECTION_ORDER.indexOf(a);
        const ib = SECTION_ORDER.indexOf(b);
        const va = ia === -1 ? 999 : ia;
        const vb = ib === -1 ? 999 : ib;
        if (va !== vb) return va - vb;
        return a.localeCompare(b, "cs");
      }

      function makeTile(art) {
        const a = document.createElement("a");
        a.className = "tile";
        a.href = "viewer.html?p=" + encodeURIComponent(art.path);
        a.textContent = displayTitle(art);
        return a;
      }

      function renderSection(container, label, arts) {
        if (!arts.length) return;
        const sec = document.createElement("section");
        sec.className = "section";
        const h = document.createElement("h2");
        h.className = "section-head";
        h.textContent = label;
        sec.appendChild(h);
        const grid = document.createElement("div");
        grid.className = "tile-grid";
        for (const x of arts) grid.appendChild(makeTile(x));
        sec.appendChild(grid);
        container.appendChild(sec);
      }

      function repaint() {
        const needle = qEl.value.trim().toLowerCase();
        const filtered = needle
          ? articles.filter(
              (a) =>
                a.title.toLowerCase().includes(needle) ||
                displayTitle(a).toLowerCase().includes(needle)
            )
          : articles.slice();

        const { main, tail } = partition(filtered);
        const groups = groupByLabel(main);

        sectionsEl.innerHTML = "";
        const labels = Object.keys(groups).sort(sortSectionLabel);
        for (const label of labels) renderSection(sectionsEl, label, groups[label]);

        if (tail.length) {
          const wrap = document.createElement("div");
          wrap.className = "tail-block";
          renderSection(wrap, "Osobní & briefing", tail);
          sectionsEl.appendChild(wrap);
        }
      }

      qEl.addEventListener("input", repaint);
      repaint();
    })();
  </script>
</body>
</html>
