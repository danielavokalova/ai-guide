<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GOL IBE Help · AI Guide</title>
  <meta name="color-scheme" content="dark light" />
  <style>
    :root {
      --bg: #0f1419;
      --bg-elev: #1a2332;
      --border: #2d3a4d;
      --text: #e7ecf3;
      --muted: #8b9cb3;
      --accent: #5b9fd4;
      --accent-dim: #3d6f94;
      --radius: 10px;
      --font: "Segoe UI", system-ui, -apple-system, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      line-height: 1.55;
    }
    header {
      padding: 1rem 1.25rem;
      border-bottom: 1px solid var(--border);
      background: var(--bg-elev);
      position: sticky;
      top: 0;
      z-index: 10;
    }
    header h1 {
      margin: 0 0 0.35rem;
      font-size: 1.15rem;
      font-weight: 600;
    }
    header p { margin: 0; font-size: 0.85rem; color: var(--muted); }
    .search {
      margin-top: 0.75rem;
      width: 100%;
      max-width: 420px;
      padding: 0.55rem 0.75rem;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-size: 0.95rem;
    }
    .search:focus {
      outline: 2px solid var(--accent);
      border-color: var(--accent-dim);
    }
    .layout {
      display: grid;
      grid-template-columns: minmax(220px, 280px) 1fr;
      min-height: calc(100vh - 120px);
    }
    @media (max-width: 860px) {
      .layout { grid-template-columns: 1fr; }
      aside { border-right: none !important; border-bottom: 1px solid var(--border); max-height: 40vh; }
    }
    aside {
      border-right: 1px solid var(--border);
      overflow: auto;
      padding: 0.75rem 0;
    }
    .cat {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      padding: 0.5rem 1rem 0.25rem;
    }
    nav button {
      display: block;
      width: 100%;
      text-align: left;
      padding: 0.45rem 1rem;
      border: none;
      background: transparent;
      color: var(--text);
      font-size: 0.88rem;
      cursor: pointer;
      border-left: 3px solid transparent;
    }
    nav button:hover { background: rgba(91, 159, 212, 0.08); }
    nav button.active {
      border-left-color: var(--accent);
      background: rgba(91, 159, 212, 0.12);
    }
    main {
      padding: 1.25rem 1.5rem 3rem;
      overflow: auto;
      max-width: 900px;
    }
    .doc-meta {
      font-size: 0.8rem;
      color: var(--muted);
      margin-bottom: 1rem;
    }
    .content :is(h1, h2, h3) { margin-top: 1.4rem; margin-bottom: 0.5rem; }
    .content h1 { font-size: 1.5rem; border-bottom: 1px solid var(--border); padding-bottom: 0.35rem; }
    .content a { color: var(--accent); }
    .content code {
      background: var(--bg-elev);
      padding: 0.12rem 0.35rem;
      border-radius: 4px;
      font-size: 0.88em;
    }
    .content pre {
      background: var(--bg-elev);
      padding: 1rem;
      border-radius: var(--radius);
      overflow: auto;
      border: 1px solid var(--border);
    }
    .content pre code { background: none; padding: 0; }
    .content img { max-width: 100%; height: auto; border-radius: 6px; }
    .empty { color: var(--muted); font-style: italic; }
    footer {
      padding: 1rem;
      text-align: center;
      font-size: 0.75rem;
      color: var(--muted);
      border-top: 1px solid var(--border);
    }
  </style>
</head>
<body>
  <header>
    <h1>GOL IBE Help · AI Guide</h1>
    <p>Browse exported help articles. Use search to filter by title.</p>
    <input type="search" class="search" id="q" placeholder="Search titles…" autocomplete="off" />
  </header>
  <div class="layout">
    <aside>
      <div id="nav"></div>
    </aside>
    <main>
      <div id="meta" class="doc-meta"></div>
      <article id="view" class="content">
        <p class="empty">Select an article from the list.</p>
      </article>
    </main>
  </div>
  <footer>Static export · GitHub Pages</footer>
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script>
    (async function () {
      const navEl = document.getElementById("nav");
      const viewEl = document.getElementById("view");
      const metaEl = document.getElementById("meta");
      const qEl = document.getElementById("q");

      const res = await fetch("manifest.json");
      if (!res.ok) {
        viewEl.innerHTML = "<p>Could not load manifest.json.</p>";
        return;
      }
      const data = await res.json();
      const articles = data.articles || [];

      function groupByCategory(items) {
        const m = {};
        for (const a of items) {
          const key = a.categoryLabel || a.category;
          if (!m[key]) m[key] = [];
          m[key].push(a);
        }
        return m;
      }

      let activeBtn = null;
      let hasAutoLoaded = false;
      async function loadDoc(art, btn) {
        if (activeBtn) activeBtn.classList.remove("active");
        if (btn) {
          activeBtn = btn;
          btn.classList.add("active");
        }
        metaEl.textContent = art.categoryLabel + " · " + art.path;
        viewEl.innerHTML = "<p class='empty'>Loading…</p>";
        const r = await fetch(art.path);
        const md = await r.text();
        viewEl.innerHTML = marked.parse(md);
      }

      function repaint() {
        const needle = qEl.value.trim().toLowerCase();
        const filtered = needle
          ? articles.filter((a) => a.title.toLowerCase().includes(needle))
          : articles.slice();
        const groups = groupByCategory(filtered);
        navEl.innerHTML = "";
        for (const ck of Object.keys(groups).sort()) {
          const items = groups[ck];
          const cdiv = document.createElement("div");
          cdiv.className = "cat";
          cdiv.textContent = ck;
          navEl.appendChild(cdiv);
          const wrap = document.createElement("nav");
          for (const a of items) {
            const b = document.createElement("button");
            b.type = "button";
            b.textContent = a.title;
            b.addEventListener("click", () => loadDoc(a, b));
            wrap.appendChild(b);
          }
          navEl.appendChild(wrap);
        }
        if (!needle && filtered.length && !hasAutoLoaded) {
          const firstBtn = navEl.querySelector("button");
          if (firstBtn) {
            hasAutoLoaded = true;
            loadDoc(filtered[0], firstBtn);
          }
        }
      }

      qEl.addEventListener("input", repaint);
      repaint();
    })();
  </script>
</body>
</html>
